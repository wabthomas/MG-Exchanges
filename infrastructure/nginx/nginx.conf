# MG-Exchange — reverse proxy devant l'API.
#
# Rôle : point d'entrée unique, limitation de débit en amont, bornage des requêtes,
# transmission fiable de l'adresse du client et de l'identifiant de requête.
#
# TLS : ce fichier écoute en HTTP (port 8080), pour l'environnement local ou derrière un
# terminateur TLS (répartiteur de charge). La terminaison TLS directe par Nginx et la
# gestion des certificats sont traitées en phase 9 (docs/DEPLOYMENT.md).

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;

    # Répertoires temporaires inscriptibles sans privilèges.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Journaux d'accès en JSON, corrélés à ceux de l'API par l'identifiant de requête.
    # La chaîne de requête n'est pas journalisée (elle peut contenir des jetons).
    log_format json_access escape=json
        '{"time":"$time_iso8601","requestId":"$request_id","clientIp":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytesSent":$body_bytes_sent,"requestTime":$request_time,'
        '"upstreamTime":"$upstream_response_time","userAgent":"$http_user_agent"}';
    access_log /dev/stdout json_access;
    error_log  /dev/stderr warn;

    # Bornage des requêtes (l'API applique en plus sa propre limite de corps : 100 Ko).
    # Une seule route admet un corps plus volumineux : l'envoi d'une pièce de vérification
    # d'identité (voir son bloc `location`, plus bas).
    client_max_body_size        128k;
    client_body_timeout         10s;
    client_header_timeout       10s;
    large_client_header_buffers 4 8k;
    keepalive_timeout           65s;
    send_timeout                30s;

    # Première ligne de défense : 20 requêtes/seconde par adresse IP, rafales de 40.
    # L'API applique ensuite ses propres limites, plus fines (compteurs Redis partagés).
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_req_status 429;

    # Envois de pièces en cours, par adresse IP (route d'envoi, plus bas).
    limit_conn_zone $binary_remote_addr zone=uploads_per_ip:10m;
    limit_conn_status 429;

    gzip            on;
    gzip_types      application/json application/problem+json;
    gzip_min_length 1024;

    # --- Erreurs produites par Nginx lui-même -----------------------------------------------
    # Elles suivent le contrat d'erreur de l'API (RFC 9457, application/problem+json) : un client
    # n'interprète qu'un seul format, que la réponse vienne du proxy ou de l'API. Leur conformité
    # au contrat est vérifiée par apps/api/src/common/http/nginx-problem-details.spec.ts.
    #
    # `instance` : le chemin demandé, recopié seulement s'il ne contient que des caractères
    # n'exigeant aucun échappement JSON (sinon, chaîne vide).
    map $uri $problem_instance {
        "~^(?<safe_path>[A-Za-z0-9/_.~:@+,;=!&()*%-]*)$"  $safe_path;
        default                                            "";
    }
    # `timestamp` : UTC, au format de l'API (suffixe Z). Nginx doit donc tourner en UTC.
    map $time_iso8601 $problem_timestamp {
        "~^(?<utc_time>.+)\+00:00$"  "${utc_time}Z";
        default                      $time_iso8601;
    }

    upstream mgx_api {
        server api:3000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        # L'adresse du client est celle vue par Nginx : tout X-Forwarded-For fourni par le
        # client est écrasé, il ne peut donc pas usurper une adresse (TRUST_PROXY_HOPS=1).
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # Les réponses d'erreur de l'API sont relayées telles quelles ; seules les erreurs
        # produites ici sont mises au format ci-dessous.
        error_page 404         @problem_not_found;
        error_page 413         @problem_payload_too_large;
        error_page 429         @problem_rate_limited;
        error_page 502 503 504 =503 @problem_unavailable;

        location /api/ {
            limit_req zone=api_per_ip burst=40 nodelay;
            proxy_pass http://mgx_api;
        }

        # Envoi d'une pièce de vérification d'identité : la seule route qui admet un corps
        # volumineux. L'API le borne elle-même (5 Mio, deux minutes, huit réceptions à la
        # fois) ; ici :
        #   - 6 Mio au plus : au-delà, Nginx refuse sans rien transmettre ;
        #   - le corps est transmis au fil de l'eau, sans copie sur le disque du proxy. Une pièce
        #     d'identité n'y est donc jamais écrite en clair, et l'API refuse un envoi irrecevable
        #     (jeton, quota, dossier) avant d'en avoir reçu le contenu ;
        #   - 30 s de silence tolérées entre deux lectures (liaisons mobiles instables) ;
        #   - quatre envois simultanés au plus par adresse IP.
        location ~ "^/api/v1/me/verification/cases/[0-9a-f-]{36}/documents$" {
            limit_req  zone=api_per_ip burst=40 nodelay;
            limit_conn uploads_per_ip 4;
            client_max_body_size    6m;
            client_body_timeout     30s;
            proxy_request_buffering off;
            proxy_pass http://mgx_api;
        }

        # Sonde de vivacité : exposée pour le répartiteur de charge.
        location = /health/live {
            access_log off;
            proxy_pass http://mgx_api;
        }

        # La sonde de disponibilité indique l'état de chaque dépendance : réservée au réseau interne.
        location = /health/ready {
            return 404;
        }

        location / {
            return 404;
        }

        location @problem_not_found {
            default_type application/problem+json;
            add_header X-Request-Id $request_id always;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 404 '{"type":"about:blank","title":"Not Found","status":404,"code":"NOT_FOUND","detail":"The requested resource does not exist.","instance":"$problem_instance","requestId":"$request_id","timestamp":"$problem_timestamp"}';
        }

        location @problem_payload_too_large {
            default_type application/problem+json;
            add_header X-Request-Id $request_id always;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 413 '{"type":"about:blank","title":"Content Too Large","status":413,"code":"PAYLOAD_TOO_LARGE","detail":"The request body is too large.","instance":"$problem_instance","requestId":"$request_id","timestamp":"$problem_timestamp"}';
        }

        location @problem_rate_limited {
            default_type application/problem+json;
            add_header X-Request-Id $request_id always;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Retry-After 1 always;
            return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"code":"RATE_LIMITED","detail":"Too many requests. Please retry later.","instance":"$problem_instance","requestId":"$request_id","timestamp":"$problem_timestamp"}';
        }

        # API injoignable, en cours de redémarrage ou trop lente (502, 503, 504).
        location @problem_unavailable {
            default_type application/problem+json;
            add_header X-Request-Id $request_id always;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header Retry-After 5 always;
            return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"code":"SERVICE_UNAVAILABLE","detail":"The service is temporarily unavailable. Please retry later.","instance":"$problem_instance","requestId":"$request_id","timestamp":"$problem_timestamp"}';
        }
    }
}
