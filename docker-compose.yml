# MG-Exchange — environnement local.
#
#   docker compose up -d                  PostgreSQL + Redis (l'API tourne sur la machine hôte)
#   docker compose --profile app up -d    + migrations, API conteneurisée et Nginx
#
# Les valeurs proviennent du fichier `.env` (modèle : `.env.example`). Aucun secret n'est
# versionné ; aucune valeur par défaut n'existe pour les mots de passe.
name: mg-exchange

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?définir POSTGRES_SUPERUSER_PASSWORD dans .env}
      MGX_DB_NAME: ${MGX_DB_NAME:-mgx}
      MGX_DB_OWNER_USER: ${MGX_DB_OWNER_USER:-mgx_owner}
      MGX_DB_OWNER_PASSWORD: ${MGX_DB_OWNER_PASSWORD:?définir MGX_DB_OWNER_PASSWORD dans .env}
      MGX_DB_APP_USER: ${MGX_DB_APP_USER:-mgx_app}
      MGX_DB_APP_PASSWORD: ${MGX_DB_APP_PASSWORD:?définir MGX_DB_APP_PASSWORD dans .env}
    volumes:
      # PostgreSQL 18 : le volume se monte sur /var/lib/postgresql (données sous 18/docker).
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/docker/postgres/sql:/mgx/sql:ro
    ports:
      # Accessible uniquement depuis la machine hôte.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      # Par TCP, et non par le socket local : pendant l'initialisation, le serveur temporaire
      # n'écoute que sur le socket. L'état « sain » signifie donc que les rôles et les bases
      # existent et que le serveur définitif accepte les connexions.
      test:
        ['CMD-SHELL', 'pg_isready --host 127.0.0.1 --username postgres --dbname "$${MGX_DB_NAME}"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?définir REDIS_PASSWORD dans .env}
    # noeviction : exigé par BullMQ (une file ne doit jamais perdre de traitements).
    # appendonly : les files survivent à un redémarrage.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?définir REDIS_PASSWORD dans .env}
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      # redis-cli s'authentifie avec REDISCLI_AUTH ; son code de sortie vaut 0 même sur une
      # réponse d'erreur, d'où la vérification explicite de la réponse.
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  # Migrations : tâche ponctuelle, exécutée avec le rôle propriétaire du schéma.
  migrate:
    profiles: ['app']
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: migrator
    restart: 'no'
    environment:
      DATABASE_MIGRATION_URL: postgresql://${MGX_DB_OWNER_USER:-mgx_owner}:${MGX_DB_OWNER_PASSWORD}@postgres:5432/${MGX_DB_NAME:-mgx}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      TRUST_PROXY_HOPS: '1'
      LOG_LEVEL: info
      # Rôle applicatif : lecture/écriture des données, aucun droit sur le schéma.
      DATABASE_URL: postgresql://${MGX_DB_APP_USER:-mgx_app}:${MGX_DB_APP_PASSWORD}@postgres:5432/${MGX_DB_NAME:-mgx}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Exigées par l'API, qui refuse de démarrer sans elles (voir .env.example).
      AUTH_CODE_HMAC_SECRET: ${AUTH_CODE_HMAC_SECRET:-}
      AUTH_SECRETS_ENCRYPTION_KEY: ${AUTH_SECRETS_ENCRYPTION_KEY:-}
      # Envoi réel des e-mails : facultatif (une variable vide est ignorée par l'API).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Vérification d'identité : facultative. Définir la clé active le stockage chiffré des
      # pièces dans le volume monté ci-dessous ; sans clé, les deux variables restent vides
      # (forme `${VAR:+valeur}` : « valeur si VAR est définie », comprise par Docker Compose
      # depuis la mi-2022).
      KYC_ENCRYPTION_KEY: ${KYC_ENCRYPTION_KEY:-}
      KYC_STORAGE_DIR: ${KYC_ENCRYPTION_KEY:+/var/lib/mgx/kyc}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    cap_drop: ['ALL']
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      # Pièces de vérification d'identité, chiffrées : le seul emplacement inscriptible et
      # persistant de l'API. À sauvegarder avec la base ; la clé, elle, se sauvegarde ailleurs.
      - kyc-documents:/var/lib/mgx/kyc

  nginx:
    profiles: ['app']
    image: nginx:1.30-alpine
    restart: unless-stopped
    environment:
      # Les erreurs produites par Nginx portent un horodatage UTC, comme celles de l'API.
      TZ: UTC
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '${HTTP_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1:8080/health/live']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  kyc-documents:
